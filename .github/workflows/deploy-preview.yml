name: Preview artifact

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/public/preview.html"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: boss-built-preview
          path: apps/web/public/preview.html
