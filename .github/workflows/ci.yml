name: Boss Built CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

  api:
    name: API check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix ../../packages/db || true
      - run: npm install
      - run: npx tsc -p tsconfig.json --noEmit || true
      - run: test -f src/index.ts && test -f src/lib/genesis.ts && echo OK

  db:
    name: DB files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f packages/db/drizzle/0000_init.sql
          test -f docker-compose.yml
          echo OK
