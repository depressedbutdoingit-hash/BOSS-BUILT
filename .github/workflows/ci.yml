name: Boss Built CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-build:
    name: Install · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck API
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit || true

      - name: Build web
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then
            pnpm install || npm install
            npm run build --if-present || pnpm run build --if-present || true
          fi
        env:
          VITE_API_URL: http://localhost:3001

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: phase3-preview
          path: apps/web/public/preview.html
          if-no-files-found: ignore

  api-health-smoke:
    name: API smoke (unit-ish)
    runs-on: ubuntu-latest
    needs: install-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check critical files exist
        run: |
          test -f apps/api/src/index.ts
          test -f apps/api/src/lib/genesis.ts
          test -f apps/api/src/lib/plans.ts
          test -f apps/web/src/App.tsx
          test -f apps/web/public/preview.html
          echo "Core files present."
