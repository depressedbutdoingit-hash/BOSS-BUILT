services:
  postgres:
    image: postgres:16-alpine
    container_name: boss-built-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boss_built
    volumes:
      - boss_pg_data:/var/lib/postgresql/data
      - ./packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boss_built"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boss_pg_data:
